<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2145">
<title>Chant – évaluations</title>
<style>
:root{
  --ink:#1c2145; --ink2:#3b4268; --muted:#6b7291;
  --paper:#f3f5fb; --card:#ffffff; --line:#dfe3ef;
  --pink:#e8336d; --blue:#3d4bdb;
  --l4:#0b8a68; --l4t:#e1f4ec;
  --l3:#7fae1f; --l3t:#edf5d9;
  --l2:#f2a516; --l2t:#fdf0d2;
  --l1:#d93a3a; --l1t:#fbe2e2;
  --font:"Avenir Next Rounded","Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--paper)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.clsel{position:relative}
.clsel select{appearance:none;-webkit-appearance:none;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 38px 9px 18px;font-weight:800;font-size:17px}
.clsel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}

main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px}
.view{padding-bottom:20px}

nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--muted)}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--pink)}

/* ---------- Tirage ---------- */
.roue-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}
.seg-row{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.seg-row>span{font-weight:700;color:var(--ink2);font-size:15px;white-space:nowrap}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button[disabled]{opacity:.55}
.landed{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:40px;margin:10px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;font-size:15px}
.pill b{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:14px;background:var(--pink);color:#fff;font-size:14px}
.pill.hint{background:none;color:var(--muted);font-weight:700;padding:6px}
.left{font-size:15px;color:var(--ink2);white-space:nowrap}
.left b{font-size:28px;font-weight:800;color:var(--ink);margin-right:4px}
.switch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#c5cadc;position:relative;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--l4)}
.switch input:checked::after{transform:translateX(18px)}

.wheel-wrap{position:relative;margin:14px auto 8px;width:min(calc(100vw - 40px),calc(100vh - 380px),440px);width:min(calc(100vw - 40px),calc(100dvh - 380px),440px);min-width:230px;aspect-ratio:1}
#wheel{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 7px var(--ink),0 14px 30px rgba(28,33,69,.28);will-change:transform}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--pink);filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.hub{position:absolute;z-index:2;top:50%;left:50%;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:5px solid #fff;background:var(--ink);color:#fff;font-weight:800;font-size:clamp(14px,4.4vw,24px);box-shadow:0 0 0 4px var(--pink),0 6px 14px rgba(0,0,0,.35)}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub[disabled]{opacity:.85}
.link{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}

.empty{margin:30px 0;padding:26px 20px;background:var(--card);border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--ink2);line-height:1.45}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}

/* ---------- Barème ---------- */
.app.bar .top{display:none}
.app.bar main{padding-top:calc(8px + env(safe-area-inset-top))}
#v-bareme{display:flex;flex-direction:column;height:100%;padding-bottom:8px}
.badge{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:19px}
.gchips{flex:none;display:flex;gap:6px;margin:0 0 8px}
.gc{flex:none;min-width:46px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 5px;font-weight:800;font-size:15px}
.gc .badge{min-width:34px;height:34px;border-radius:11px;font-size:16px;padding:0 6px}
.gc.cur{flex:1;min-width:0;justify-content:flex-start;padding:0 10px 0 5px;border-color:var(--ink);font-size:17px}
.gc.cur .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc.done{background:var(--l4t)}
.gc.done .badge{background:var(--l4)}
.gc.none{color:var(--muted);padding-left:14px}
.icon-btn{flex:none;width:46px;height:46px;border-radius:14px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;padding:0}
.icon-btn svg{width:24px;height:24px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.icon-btn[aria-pressed="true"] svg{stroke:#fff}

.crit-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.crit{flex:1 1 0;min-height:80px;display:flex;flex-direction:column;background:var(--card);border-radius:16px;padding:6px 8px 7px;box-shadow:0 1px 0 var(--line)}
.crit-h{flex:none;display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 4px}
.crit-h h3{margin:0;font-size:15.5px;font-weight:800}
.crit-h span{font-size:13px;font-weight:800;color:var(--ink2)}
.lv{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lvl{min-height:0;height:100%;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;text-align:center;background:var(--t);color:var(--ink)}
.lvl .lb{font-size:10.5px;font-weight:800;line-height:1.05}
.lvl .pt{font-size:clamp(18px,3.3vh,26px);font-weight:800;line-height:1}
.lvl.ghost{visibility:hidden}
.lvl[data-k="4"]{--c:var(--l4);--t:var(--l4t)}
.lvl[data-k="3"]{--c:var(--l3);--t:var(--l3t)}
.lvl[data-k="2"]{--c:var(--l2);--t:var(--l2t)}
.lvl[data-k="1"]{--c:var(--l1);--t:var(--l1t)}
.lvl.on{background:var(--c);border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.lvl[data-k="4"].on,.lvl[data-k="1"].on{color:#fff}
.lvl.only .lb{font-size:12.5px}
.split{cursor:default}
.split .halves{display:flex;gap:4px;width:100%;padding:0 3px;flex:none}
.split .halves button{flex:1;height:clamp(26px,4.6vh,36px);border-radius:10px;border:2px solid transparent;background:#fff;font-weight:800;font-size:17px;line-height:1;padding:0}
.split .halves button.on{background:var(--c);color:#fff;border-color:var(--ink)}
.split.has-on{border-color:var(--ink);background:var(--t)}

.actionbar{flex:none;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.tot{flex:1;min-width:0}
.tot .big{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.tot .big small{font-size:16px;color:var(--muted);font-weight:800;margin-left:3px}
.tot .sub{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15.5px}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary[disabled]{background:#c9cde0;color:#fff}
.btn.next{background:var(--ink)}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink2);padding:11px 14px}
.btn.danger{background:none;color:var(--l1);text-decoration:underline;text-underline-offset:3px;padding:10px}
#save-btn{padding:13px 14px;min-width:104px}

@media (max-height:700px){
  .crit{min-height:74px}
  .lvl .lb{font-size:10px}
}

/* ---------- Classe ---------- */
.cl-head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 12px}
.cl-head h2{margin:0;font-size:24px;font-weight:800}
.cl-head span{color:var(--muted);font-weight:700;font-size:15px}
.cl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:0;border-radius:16px;padding:8px 14px 8px 8px;width:100%;font-weight:700;font-size:17px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .gr{font-weight:800;color:var(--l4);font-size:17px}
.row .dr{font-size:12px;font-weight:800;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 9px}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:20px}

/* ---------- Résultat du tirage ---------- */
.result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(28,33,69,.86)}
.res-card{width:min(100%,460px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:22px 20px 20px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.res-title{margin:0 0 6px;font-weight:800;font-size:15px;color:var(--muted)}
.res-list{display:grid;gap:8px;margin:6px 0 20px}
.res-row{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border-radius:20px;padding:8px 14px 8px 8px}
.res-row .badge{min-width:52px;height:52px;border-radius:16px;background:var(--pink);font-size:24px}
.res-row .nm{font-weight:800;font-size:min(7.6vw,32px);line-height:1.05;overflow-wrap:anywhere}
.res-list.one{margin:10px 0 22px}
.res-list.one .res-row{flex-direction:column;justify-content:center;text-align:center;gap:12px;background:none;padding:0}
.res-list.one .badge{min-width:84px;height:84px;border-radius:26px;font-size:44px}
.res-list.one .nm{font-size:min(11.5vw,64px);letter-spacing:-.02em}
.res-actions{display:grid;gap:10px}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- Fenêtres + toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(28,33,69,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,760px);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:21px;font-weight:800}
.sheet .hint{margin:0 0 10px;color:var(--ink2);line-height:1.4;font-size:15px}
.sheet textarea,.sheet input[type=text]{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);font-size:16px}
.sheet textarea{min-height:180px;resize:vertical}
.imp-info{min-height:22px;margin:8px 0 12px;font-weight:700;color:var(--l4);font-size:14px}
.sheet .stack{display:grid;gap:10px;margin-top:6px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pk{display:flex;align-items:center;gap:8px;text-align:left;background:var(--paper);border:2px solid transparent;border-radius:14px;padding:6px 8px 6px 6px;font-weight:700;font-size:14px;min-width:0}
.pk .badge{min-width:34px;height:34px;border-radius:11px;font-size:16px}
.pk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pk.done{background:var(--l4t)}
.pk.cur{border-color:var(--pink)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:999px;max-width:92vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* ---------- Micro + scan Plickers ---------- */
.tools{display:flex;align-items:center;gap:8px}
.top .icon-btn{width:42px;height:42px}
.gtop{flex:none;display:flex;gap:6px;align-items:flex-start;margin:0 0 8px}
.gtop .gchips{flex:1;min-width:0;margin:0;overflow:hidden}
.gtop .tools{gap:4px}
.gtop .icon-btn{width:40px;height:48px}
.mic-btn[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);animation:pulse 1.4s infinite}
.mic-btn[aria-pressed="true"] svg{stroke:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(232,51,109,.22)}}
.scan{position:fixed;inset:0;z-index:45;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}
.stage{position:relative;flex:none;width:100%;aspect-ratio:4/3;max-height:46vh;background:#000;border-radius:18px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scan-hint{margin:0;font-size:14px;font-weight:700;line-height:1.35;opacity:.85}
.scan-list{flex:1;min-height:0;overflow:auto;display:grid;gap:8px;align-content:start}
.sc{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:16px;padding:8px 12px 8px 8px;font-weight:800}
.sc.unk{background:var(--l2t);padding-left:14px}
.sc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .ltr{background:var(--ink);color:#fff;border-radius:10px;padding:3px 10px}
.sc input{width:66px;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:800;background:#fff}
.sc .btn{padding:10px 14px}
.scan .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e8336d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.8"/><circle cx="17.5" cy="16" r="2.8"/></svg>
      <span>Chant</span>
    </div>
    <div class="tools"><span class="tools" id="hdr-tools"></span><label class="clsel"><select id="cls-select" aria-label="Classe"></select></label></div>
  </header>

  <main id="main">
    <!-- TIRAGE -->
    <section id="v-roue" class="view">
      <div id="roue-ui">
        <div class="roue-meta">
          <div class="left"><b id="left-count">0</b><span id="left-label"></span></div>
          <label class="switch"><input type="checkbox" id="exclude"><span>Sans remise</span></label>
        </div>
        <div class="seg-row"><span>Groupe de</span><div class="seg" id="seg" role="group" aria-label="Nombre d’élèves par groupe"></div></div>
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" aria-hidden="true"></canvas>
          <button id="spin" class="hub" type="button" aria-label="Tirer un élève au sort">Tirer</button>
        </div>
        <div id="landed" class="landed" aria-live="polite"></div>
        <button id="reset-drawn" class="link" type="button">Remettre les tirages à zéro</button>
      </div>
      <div id="roue-empty" class="empty" hidden>
        <b>Aucun élève dans cette classe</b>
        Va dans l’onglet Classe et colle ta liste pour remplir la roue.
      </div>
    </section>

    <!-- BARÈME -->
    <section id="v-bareme" class="view" hidden>
      <div class="gtop"><div class="gchips" id="gchips"></div><span class="tools" id="bar-tools"></span></div>
      <div class="crit-list" id="crit-list"></div>
      <div class="actionbar">
        <div class="tot"><div class="big" id="tot-big"></div><div class="sub" id="tot-sub"></div></div>
        <button id="hide-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Masquer les points">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="clear-btn" class="icon-btn" type="button" aria-label="Effacer les choix">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9.8 9.8 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="save-btn" class="btn primary" type="button">Enregistrer</button>
      </div>
    </section>

    <!-- CLASSE -->
    <section id="v-classe" class="view" hidden>
      <div class="cl-head"><h2 id="cl-name"></h2><span id="cl-count"></span></div>
      <div class="cl-actions">
        <button id="imp-btn" class="btn primary" type="button">Importer une liste</button>
        <button id="new-btn" class="btn ghost" type="button">Nouvelle classe</button>
      </div>
      <div id="rows" class="rows"></div>
      <div class="foot">
        <button id="copy-btn" class="btn ghost" type="button">Copier les notes</button>
        <button id="del-btn" class="btn danger" type="button">Supprimer la classe</button>
      </div>
    </section>
  </main>

  <nav id="tabs" role="tablist">
    <button role="tab" data-v="roue" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12H3.2"/></svg>Tirage</button>
    <button role="tab" data-v="bareme" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"/></svg>Barème</button>
    <button role="tab" data-v="classe" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 010 6.6M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>Classe</button>
  </nav>
</div>

<div id="result" class="result" hidden>
  <div class="res-card" role="alertdialog" aria-live="assertive">
    <p class="res-title" id="res-title"></p>
    <div class="res-list" id="res-list"></div>
    <div class="res-actions">
      <button id="res-eval" class="btn primary" type="button">Évaluer</button>
      <button id="res-close" class="btn ghost" type="button">Fermer</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>
<div id="scan" class="scan" hidden>
  <div class="stage"><video id="scan-video" playsinline muted></video><canvas id="scan-ov"></canvas></div>
  <p class="scan-hint" id="scan-hint"></p>
  <div class="scan-list" id="scan-list"></div>
  <div class="res-actions">
    <button id="scan-go" class="btn primary" type="button" disabled>Évaluer</button>
    <button id="scan-close" class="btn ghost" type="button">Fermer</button>
  </div>
  <button id="scan-reset" class="link" type="button" style="color:#fff;opacity:.65">Oublier les cartes ajoutées</button>
</div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* ================= Données ================= */
const LS_KEY = 'chant-classe-v1';
const SEED_5C = ["Mathilde A.", "Dhananjay A.", "Amine B.", "Maréva B.", "Sofia B.", "Benjamin B.", "Louise B.", "Chloé B.", "Keiran B.", "Elena C.", "Lucas C.", "Julien C.", "Camila D.", "Lana-ange G.", "Maëlys G.", "Lény H.", "Kaïss J.", "Matilda K.", "Margaux K.", "Louise L.", "Lucas M.", "Ilhan M.", "Clara M.", "Ilyas P.", "Lucas P.", "Yahya R.", "Milla R.", "Théo S.", "Titouan S.", "Élisa T.", "Eva T."];
const MAX_CARDS = 40;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const LEVELS = [
  { k: 4, label: 'Acquis' },
  { k: 3, label: 'Presque acquis' },
  { k: 2, label: 'En cours' },
  { k: 1, label: 'Non acquis' },
];
// pts[k] : une valeur = bouton simple, deux valeurs = deux petits boutons (bas / haut)
const CRITERES = [
  { id: 'coeur',    nom: 'Par cœur',     pts: { 4: [3], 3: [2], 2: [1], 1: [0] } },
  { id: 'posture',  nom: 'Posture',      pts: { 4: [2],          2: [1], 1: [0] } },
  { id: 'rythme',   nom: 'Rythme',       pts: { 4: [5], 3: [4], 2: [3], 1: [1, 2] } },
  { id: 'justesse', nom: 'Justesse',     pts: { 4: [5], 3: [4], 2: [3], 1: [1, 2] } },
  { id: 'expr',     nom: 'Expressivité', pts: { 4: [5], 3: [4], 2: [3], 1: [1, 2] } },
];
const MAX_TOTAL = 20;

/* ================= Petits outils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  });
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const letters = s => (s || '').replace(/[^\p{L}]/gu, '');

/* ================= Sauvegarde ================= */
function defaultState() {
  return {
    current: '5C', exclude: true, hide: false, groupSize: 3, group: [],
    draft: { n: null, scores: {}, saved: false },
    classes: { '5C': { students: SEED_5C.map((name, i) => ({ n: i + 1, name })), grades: {}, drawn: [] } },
  };
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.classes && Object.keys(s.classes).length) {
        if (!s.classes[s.current]) s.current = Object.keys(s.classes)[0];
        s.draft = s.draft || { n: null, scores: {}, saved: false };
        s.groupSize = s.groupSize || 3;
        s.group = s.group || [];
        return s;
      }
    }
  } catch (e) { /* stockage indisponible : on repart d'un état neuf */ }
  return defaultState();
}
let state = load();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
const cls = () => state.classes[state.current];
const nameOf = n => { const s = cls().students.find(x => x.n === n); return s ? s.name : ''; };
const ui = { view: 'roue' };

/* ================= Import d'une liste ================= */
function isUpper(t) {
  const l = letters(t);
  return l.length > 0 && l === l.toUpperCase() && l !== l.toLowerCase();
}
function titleCase(s) {
  return s.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}
function splitName(s) {
  const toks = s.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  if (!toks.length) return null;
  if (toks.length === 1) return { nom: '', prenom: toks[0] };
  let i = 0;
  while (i < toks.length && isUpper(toks[i])) i++;
  if (i === 0) {
    // « Prénom NOM » : on prend les mots en majuscules à la fin
    let j = toks.length;
    while (j > 0 && isUpper(toks[j - 1])) j--;
    if (j < toks.length) return { nom: toks.slice(j).join(' '), prenom: toks.slice(0, j).join(' ') };
    i = 1;
  }
  if (i >= toks.length) i = 1;
  let prenom = toks.slice(i).join(' ');
  if (prenom === prenom.toUpperCase()) prenom = titleCase(prenom);
  return { nom: toks.slice(0, i).join(' '), prenom };
}
function initials(nom, k) {
  const s = letters(nom).slice(0, k);
  return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() + '.' : '';
}
function displayNames(items) {
  const k = items.map(() => 1);
  const disp = i => (items[i].prenom + ' ' + initials(items[i].nom, k[i])).trim();
  for (let round = 0; round < 12; round++) {
    const groups = {};
    items.forEach((_, i) => { (groups[disp(i)] = groups[disp(i)] || []).push(i); });
    let changed = false;
    Object.values(groups).forEach(g => {
      if (g.length < 2) return;
      g.forEach(i => { if (k[i] < letters(items[i].nom).length) { k[i]++; changed = true; } });
    });
    if (!changed) break;
  }
  const seen = {};
  return items.map((_, i) => {
    const d = disp(i);
    seen[d] = (seen[d] || 0) + 1;
    return seen[d] > 1 ? d + ' (' + seen[d] + ')' : d;
  });
}
function parseList(text) {
  const rows = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(raw => {
    if (/pr[ée]nom/i.test(raw) && /\bnom\b/i.test(raw)) return; // ligne d'en-tête
    let num = null, namePart = raw;
    if (raw.indexOf('\t') >= 0) {
      const cols = raw.split('\t').map(c => c.trim());
      if (/^\d+([.,]0+)?$/.test(cols[0]) && cols[1]) { num = parseInt(cols[0], 10); namePart = cols[1]; }
      else namePart = cols[0] || cols[1] || '';
    } else {
      const m = raw.match(/^(\d{1,2})[\s.)\-–]+(\D.*)$/);
      if (m) { num = parseInt(m[1], 10); namePart = m[2]; }
    }
    const p = splitName(namePart);
    if (p) rows.push({ num, nom: p.nom, prenom: p.prenom });
  });
  let used = rows.slice(0, MAX_CARDS);
  const nums = used.map(r => r.num);
  const keepNums = nums.every(n => n != null && n >= 1 && n <= MAX_CARDS) && new Set(nums).size === nums.length;
  const names = displayNames(used);
  return used.map((r, i) => ({ n: keepNums ? r.num : i + 1, name: names[i] }))
             .sort((a, b) => a.n - b.n);
}
function applyImport(list) {
  const c = cls();
  const old = {};
  c.students.forEach(s => { old[s.n] = s.name; });
  const same = new Set(list.filter(s => old[s.n] === s.name).map(s => s.n));
  c.students = list;
  const g = {};
  Object.keys(c.grades).forEach(n => { if (same.has(+n)) g[n] = c.grades[n]; });
  c.grades = g;
  c.drawn = c.drawn.filter(n => same.has(n));
  state.draft = { n: null, scores: {}, saved: false };
  state.group = [];
  save();
}

/* ================= Fenêtres, messages ================= */
function openModal(...content) {
  const sheet = $('#sheet');
  sheet.replaceChildren(...content.flat());
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function askText(title, value, okLabel, onOk) {
  const input = h('input', { type: 'text', value: value || '', autocomplete: 'off' });
  const ok = () => { const v = input.value.trim(); if (v) { closeModal(); onOk(v); } };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  openModal(
    h('h3', {}, title), input,
    h('div', { class: 'stack' },
      h('button', { class: 'btn primary', type: 'button', onclick: ok }, okLabel),
      h('button', { class: 'btn ghost', type: 'button', onclick: closeModal }, 'Annuler'))
  );
  setTimeout(() => input.focus(), 60);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = h('textarea', { style: 'position:fixed;opacity:0;top:0' });
    ta.value = t; document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

/* ================= Navigation ================= */
function setView(v) {
  ui.view = v;
  $('.app').classList.toggle('bar', v === 'bareme');
  ['roue', 'bareme', 'classe'].forEach(x => { $('#v-' + x).hidden = x !== v; });
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v ? 'true' : 'false'));
  $('#main').scrollTop = 0;
  if (v === 'roue') requestAnimationFrame(renderRoue);
  if (v === 'bareme') renderBareme();
  if (v === 'classe') renderClasse();
}
$$('#tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));

function renderTop() {
  const sel = $('#cls-select');
  sel.replaceChildren(...Object.keys(state.classes).sort().map(k => h('option', { value: k, selected: k === state.current }, k)));
}
$('#cls-select').addEventListener('change', e => {
  state.current = e.target.value;
  state.group = []; landed = [];
  state.draft = { n: null, scores: {}, saved: false };
  save(); setView(ui.view);
});

/* ================= Tirage (roue) ================= */
const WHEEL_COLORS = ['#3d4bdb', '#e8336d', '#0b8a68', '#f2a516', '#1c93d6', '#8a4fe0'];
let wheelRot = 0, spinning = false, landed = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function activeStudents() {
  const c = cls();
  return c.students.filter(s => !(state.exclude && c.drawn.indexOf(s.n) >= 0)).sort((a, b) => a.n - b.n);
}
function resetWheelRotation() {
  const cv = $('#wheel');
  cv.style.transition = 'none';
  cv.style.transform = 'rotate(0deg)';
  wheelRot = 0;
}
function drawWheel(items) {
  const cv = $('#wheel');
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  const R = size / 2, N = items.length;
  g.save(); g.translate(R, R);
  if (!N) {
    g.fillStyle = '#c9cde0'; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
    g.restore(); return;
  }
  const seg = Math.PI * 2 / N;
  for (let i = 0; i < N; i++) {
    const a0 = -Math.PI / 2 + i * seg;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, a0, a0 + seg); g.closePath();
    g.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.5; g.stroke();
  }
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.14)';
  [0.38, 0.45, 0.52].forEach(f => { g.beginPath(); g.arc(0, 0, R * f, 0, Math.PI * 2); g.stroke(); });
  const arc = Math.PI * 2 * R * 0.8 / N;
  const fs = Math.max(10, Math.min(arc * 0.7, R * 0.17));
  g.font = '800 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
  g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let i = 0; i < N; i++) {
    const mid = -Math.PI / 2 + (i + 0.5) * seg;
    g.save(); g.rotate(mid);
    g.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length] === '#f2a516' ? '#1c2145' : '#fff';
    g.fillText(String(items[i].n), R * 0.93, 0);
    g.restore();
  }
  g.restore();
}
function renderSeg() {
  $('#seg').replaceChildren(...[1, 2, 3, 4, 5].map(n => {
    const on = n === state.groupSize;
    return h('button', { type: 'button', class: on ? 'on' : '', 'aria-pressed': on ? 'true' : 'false', disabled: spinning,
      onclick: () => { state.groupSize = n; save(); renderSeg(); renderStrip(); } }, String(n));
  }));
}
function renderStrip(list) {
  const items = list || state.group.map(n => ({ n, name: nameOf(n) })).filter(s => s.name);
  $('#landed').replaceChildren(...(items.length
    ? items.map(s => h('span', { class: 'pill' }, h('b', {}, String(s.n)), s.name))
    : [h('span', { class: 'pill hint' }, 'Touche « Tirer » pour désigner ' + (state.groupSize > 1 ? 'un groupe de ' + state.groupSize : 'un élève'))]));
}
function renderRoue() {
  const c = cls();
  const has = c.students.length > 0;
  $('#roue-ui').hidden = !has;
  $('#roue-empty').hidden = has;
  $('#exclude').checked = !!state.exclude;
  if (!has) return;
  const items = activeStudents();
  $('#left-count').textContent = items.length;
  $('#left-label').textContent = state.exclude
    ? (items.length > 1 ? ' restants' : ' restant') + ' sur ' + c.students.length
    : ' élèves dans la roue';
  renderSeg();
  renderStrip(landed.length ? landed : undefined);
  resetWheelRotation();
  drawWheel(items);
}
$('#exclude').addEventListener('change', e => { state.exclude = e.target.checked; save(); renderRoue(); });
$('#reset-drawn').addEventListener('click', () => { cls().drawn = []; save(); renderRoue(); toast('Tous les élèves sont de nouveau dans la roue'); });

function spinTo(N, t, dur, turns) {
  const seg = 360 / N;
  const center = (t + 0.5) * seg + (Math.random() - 0.5) * seg * 0.7;
  const delta = (((-center - wheelRot) % 360) + 360) % 360;
  wheelRot += 360 * turns + delta;
  const cv = $('#wheel');
  void cv.offsetWidth;
  cv.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.62,.08,1)';
  cv.style.transform = 'rotate(' + wheelRot + 'deg)';
  return sleep(dur + 100);
}
async function drawGroup() {
  if (spinning) return;
  const items = activeStudents();
  if (!items.length) { toast('Tous les élèves sont passés. Remets les tirages à zéro.'); return; }
  const k = Math.min(state.groupSize || 3, items.length);
  if (k < (state.groupSize || 3)) toast('Il n’en reste que ' + k);
  spinning = true; $('#spin').disabled = true; renderSeg();
  const pool = items.slice();
  landed = [];
  renderStrip([]);
  for (let i = 0; i < k; i++) {
    const s = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const first = i === 0;
    await spinTo(items.length, items.indexOf(s), reduceMotion ? (first ? 600 : 400) : (first ? 5200 : 3200), first ? 5 + Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 2));
    landed.push(s);
    renderStrip(landed);
    if (navigator.vibrate) navigator.vibrate(30);
    if (i < k - 1) await sleep(reduceMotion ? 100 : 700);
  }
  const group = landed.slice();
  landed = [];
  spinning = false; $('#spin').disabled = false; renderSeg();
  showResult(group);
}
$('#spin').addEventListener('click', drawGroup);

function showResult(group) {
  const c = cls();
  group.forEach(s => { if (c.drawn.indexOf(s.n) < 0) c.drawn.push(s.n); });
  state.group = group.map(s => s.n);
  save();
  const title = $('#res-title');
  title.textContent = 'Groupe de ' + group.length;
  title.hidden = group.length < 2;
  const list = $('#res-list');
  list.className = 'res-list' + (group.length === 1 ? ' one' : '');
  list.replaceChildren(...group.map(s => h('div', { class: 'res-row' }, h('span', { class: 'badge' }, String(s.n)), h('span', { class: 'nm' }, s.name))));
  $('#result').hidden = false;
  if (navigator.vibrate) navigator.vibrate(60);
  confetti();
}
function closeResult() { stopConfetti(); $('#result').hidden = true; renderRoue(); }
$('#res-close').addEventListener('click', closeResult);
$('#res-eval').addEventListener('click', () => {
  stopConfetti();
  $('#result').hidden = true;
  setStudent(state.group[0]);
  setView('bareme');
});
let confettiId = 0;
function stopConfetti() { confettiId++; const cv = $('#confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
function confetti() {
  if (reduceMotion) return;
  const my = ++confettiId;
  const cv = $('#confetti');
  cv.width = innerWidth; cv.height = innerHeight;
  const g = cv.getContext('2d');
  const parts = Array.from({ length: 130 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.4,
    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 15 - 4,
    s: 6 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
    c: WHEEL_COLORS[Math.floor(Math.random() * WHEEL_COLORS.length)],
  }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      g.restore();
    });
    if (my !== confettiId) return;
    if (++f < 120) requestAnimationFrame(tick); else g.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ================= Barème ================= */
function setStudent(n) {
  const g = cls().grades[n];
  state.draft = { n, scores: g ? clone(g.scores) : {}, saved: !!g };
  save();
}
function totals() {
  const s = state.draft.scores;
  let sum = 0, n = 0;
  CRITERES.forEach(c => { if (s[c.id]) { sum += s[c.id].pts; n++; } });
  return { sum, n };
}
function pick(id, k, pts) {
  const d = state.draft;
  if (d.n == null) { toast('Choisis d’abord un élève'); openPicker(); return; }
  const cur = d.scores[id];
  if (cur && cur.k === k && cur.pts === pts) delete d.scores[id];
  else d.scores[id] = { k, pts };
  d.saved = false;
  save(); renderBareme();
}
function levelCell(cr, lv) {
  const vals = cr.pts[lv.k];
  const cur = state.draft.scores[cr.id];
  if (!vals) return h('div', { class: 'lvl ghost', 'data-k': lv.k });
  const hide = state.hide;
  if (vals.length === 1) {
    const on = cur && cur.k === lv.k;
    return h('button', { class: 'lvl' + (on ? ' on' : '') + (hide ? ' only' : ''), type: 'button', 'data-k': lv.k, 'aria-pressed': on ? 'true' : 'false',
      onclick: () => pick(cr.id, lv.k, vals[0]) },
      h('span', { class: 'lb' }, lv.label), hide ? null : h('span', { class: 'pt' }, vals[0]));
  }
  const has = cur && cur.k === lv.k;
  return h('div', { class: 'lvl split' + (has ? ' has-on' : ''), 'data-k': lv.k },
    h('span', { class: 'lb' }, lv.label),
    h('div', { class: 'halves' }, vals.map((v, i) => {
      const on = cur && cur.k === lv.k && cur.pts === v;
      return h('button', { class: on ? 'on' : '', type: 'button', 'aria-pressed': on ? 'true' : 'false',
        'aria-label': lv.label + ', ' + (i ? 'haut' : 'bas'), onclick: () => pick(cr.id, lv.k, v) }, hide ? (i ? '+' : '−') : v);
    })));
}
function renderChips() {
  const d = state.draft, c = cls();
  const box = $('#gchips');
  if (d.n == null) {
    box.replaceChildren(h('button', { class: 'gc cur none', type: 'button', onclick: openPicker }, 'Choisir un élève'));
    return;
  }
  const grp = state.group.indexOf(d.n) >= 0 ? state.group : [d.n];
  box.replaceChildren(...grp.map(n => {
    const cur = n === d.n;
    return h('button', { class: 'gc' + (cur ? ' cur' : '') + (c.grades[n] ? ' done' : ''), type: 'button', 'aria-label': nameOf(n),
      onclick: () => { if (cur) openPicker(); else { setStudent(n); renderBareme(); } } },
      h('span', { class: 'badge' }, String(n)), cur ? h('span', { class: 'nm' }, nameOf(n)) : null);
  }));
}
function nextInGroup() {
  const g = state.group, c = cls();
  const i = g.indexOf(state.draft.n);
  if (i < 0) return null;
  for (let j = 1; j < g.length; j++) {
    const m = g[(i + j) % g.length];
    if (!c.grades[m]) return m;
  }
  return null;
}
function renderBareme() {
  const d = state.draft;
  renderChips();
  const hb = $('#hide-btn');
  hb.setAttribute('aria-pressed', state.hide ? 'true' : 'false');
  hb.setAttribute('aria-label', state.hide ? 'Afficher les points' : 'Masquer les points');

  $('#crit-list').replaceChildren(...CRITERES.map(cr => {
    const cur = d.scores[cr.id];
    return h('div', { class: 'crit' },
      h('div', { class: 'crit-h' }, h('h3', {}, cr.nom),
        h('span', {}, cur && !state.hide ? cur.pts + ' pt' + (cur.pts > 1 ? 's' : '') : '')),
      h('div', { class: 'lv' }, LEVELS.map(lv => levelCell(cr, lv))));
  }));

  const { sum, n } = totals();

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const MIC = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>';
const SCAN = '<path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/>';

function setScore(id, k, hi) {
  const cr = CRITERES.find(c => c.id === id);
  const ks = [k];
  for (let i = k - 1; i >= 1; i--) ks.push(i);
  for (let i = k + 1; i <= 4; i++) ks.push(i);
  const kk = ks.find(x => cr.pts[x]), vals = cr.pts[kk];
  state.draft.scores[id] = { k: kk, pts: hi && vals.length > 1 ? vals[1] : vals[0] };
  state.draft.saved = false;
}
function handleVoice(raw) {
  const t = norm(raw);
  if (!t) return;
  toast('🎤 ' + raw.trim());
  if (ui.view === 'roue') { if (/\b(tire|tirer|tirage|roue)\b/.test(t)) drawGroup(); return; }
  let n = null;
  const m = t.match(/\b(?:eleve|numero|carte|n)\s*(\d{1,2})\b/);
  if (m) n = +m[1];
  else {
    const hits = cls().students.filter(s => new RegExp('\\b' + norm(s.name.split(' ')[0]) + '\\b').test(t));
    if (hits.length === 1) n = hits[0].n;
    else if (hits.length > 1) { toast('Plusieurs élèves : dis plutôt le numéro'); return; }
  }
  if (n != null) {
    if (!nameOf(n)) { toast('Pas d’élève n° ' + n); return; }
    setStudent(n);
  }
  if (ui.view !== 'bareme' && n != null) { setView('bareme'); return; }
  const pos = [];
  Object.entries(KEYS).forEach(([id, ws]) => ws.forEach(w => { const i = t.indexOf(w); if (i >= 0 && !pos.some(p => p.id === id)) pos.push({ id, i, len: w.length }); }));
  pos.sort((a, b) => a.i - b.i).forEach((p, j) => {
    const k = levelOf(t.slice(p.i + p.len, j + 1 < pos.length ? pos[j + 1].i : undefined));
    if (!k) return;
    if (state.draft.n == null) { toast('Dis d’abord un élève (ex. « élève 12 »)'); return; }
    setScore(p.id, k, /\b(haut|plus|plutot)\b/.test(t.slice(p.i + p.len, j + 1 < pos.length ? pos[j + 1].i : undefined)));
  });
  save(); renderBareme();
  if (/\b(efface|recommence|annule)/.test(t)) $('#clear-btn').click();
  else if (/\b(enregistre|valide|suivant|termine)/.test(t)) {
    const b = $('#save-btn');
    if (b.disabled) toast('Il manque des critères'); else b.click();
  }
}

/* ================= Plickers (caméra) ================= */
// Les cartes sont une grille 5×5 noir/blanc. L'encodage officiel n'est pas public :
// les 40 cartes du PDF officiel sont préchargées ; une autre carte peut être apprise (motif → numéro), puis reconnue

const PK = { stream: null, timer: null, seen: {}, cur: [], sig: '', lut: null, cv: null, busy: false };
// Les 40 cartes du PDF officiel (motif lu avec la lettre A en haut → numéro)
const PLK_PRESET = {'1111111111110111111110101':1,'1111111111010111111111101':2,'1111111111010111111110001':3,'1111101111110111111111101':4,'1111101111110111111110001':5,'1111101111010111111111001':6,'1111101111010111111110101':7,'1101111111110111111111101':8,'1101111111110111111110001':9,'1101111111010111111111001':10,'1101111111010111111110101':11,'1101101111110111111111001':12,'1101101111110111111110101':13,'1101101111010111111111101':14,'1101101111010111111110001':15,'1110111111110111111111101':16,'1110111111110111111110001':17,'1110111111010111111111001':18,'1110111111010111111110101':19,'1110101111110111111111001':20,'1110101111110111111110101':21,'1110101111010111111111101':22,'1110101111010111111110001':23,'1100111111110111111111001':24,'1100111111110111111110101':25,'1100111111010111111111101':26,'1100111111010111111110001':27,'1100101111110111111111101':28,'1100101111110111111110001':29,'1100101111010111111111001':30,'1100101111010111111110101':31,'1111111111110101111111101':32,'1111111111110101111110001':33,'1111111111010101111111001':34,'1111111111010101111110101':35,'1111101111110101111111001':36,'1111101111110101111110101':37,'1111101111010101111111101':38,'1111101111010101111110001':39,'1101111111110101111111001':40};
const LETTERS = ['A', 'D', 'C', 'B'];
const rotCW = p => { let o = ''; for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) o += p[(4 - c) * 5 + r]; return o; };

function pkTable() {
  if (PK.lut) return PK.lut;
  const lut = [];
  Object.entries(Object.assign({}, PLK_PRESET, state.plk || {})).forEach(([p, n]) => { let q = p; for (let k = 0; k < 4; k++) { lut.push({ p: q, n, k }); q = rotCW(q); } });

}
function pkMatch(p) {

    const near = lut.filter(e => diff1(e.p, p));
    if (near.length && near.every(e => e.n === near[0].n)) hit = near[0];

}
function pkFrame() {
  const v = $('#scan-video');

  const W = 480, H = Math.round(W * v.videoHeight / v.videoWidth), B = 8, W1 = W + 1;
  const cv = PK.cv || (PK.cv = document.createElement('canvas'));

  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(v, 0, 0, W, H);

  const g = new Uint8Array(W * H), I = new Uint32Array(W1 * (H + 1));

    let row = 0;
    for (let i = 0; i < W; i++) {

  for (let y = 0; y < ch; y++) for (let i = 0; i < cw; i++) if (co[y * cw + i] >= 10)
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {

  }

}
function drawOverlay(found) {

    if (c.hit) {
      const nm = nameOf(c.hit.n);
      return h('div', { class: 'sc' }, h('span', { class: 'badge' }, String(c.hit.n)), h('span', { class: 'nm' }, nm || 'Aucun élève avec ce numéro'), h('span', { class: 'ltr' }, LETTERS[c.hit.k]));
    }
    let free = 1;
    while (used.has(free) && free < MAX_CARDS) free++;
    const inp = h('input', { type: 'number', min: 1, max: MAX_CARDS, value: free, 'aria-label': 'Numéro de la carte' });
    return h('div', { class: 'sc unk' }, h('span', { class: 'nm' }, 'Carte inconnue'), inp,
      h('button', { class: 'btn primary', type: 'button', onclick: () => pkEnroll(c.bits, +inp.value) }, 'Associer'));
  });
  $('#scan-list').replaceChildren(...(rows.length ? rows : [h('p', { class: 'scan-hint' }, 'Aucune carte détectée pour l’instant…')]));
  const known = PK.cur.filter(c => c.hit && nameOf(c.hit.n));
  $('#scan-go').disabled = !known.length;
  $('#scan-go').textContent = known.length > 1 ? 'Évaluer ces ' + known.length + ' élèves' : 'Évaluer';
}
function pkEnroll(bits, n) {
  if (!(n >= 1 && n <= MAX_CARDS)) { toast('Numéro entre 1 et ' + MAX_CARDS); return; }
  state.plk = state.plk || {};
  let q = bits;
  for (let k = 0; k < 4; k++) {
    const e = pkTable().find(x => x.p === q && x.n !== n);
    if (e) { toast('Motif trop proche de la carte n° ' + e.n); return; }
    q = rotCW(q);
  }
  Object.keys(state.plk).forEach(p => { if (state.plk[p] === n) delete state.plk[p]; });
  state.plk[bits] = n;
  PK.lut = null; PK.sig = ''; save();
  toast('Carte n° ' + n + ' enregistrée');
}
function pkTick() {
  if (PK.busy) return;
  PK.busy = true;
  try {
    const found = pkFrame(), seen = PK.seen, now = {};
    found.forEach(f => {
      f.bits = Object.keys(seen).find(k => diff1(k, f.bits)) || f.bits;
      now[f.bits] = true;
      seen[f.bits] = Math.min(8, (seen[f.bits] || 0) + 1);
    });
    Object.keys(seen).forEach(k => { if (!now[k] && --seen[k] <= 0) delete seen[k]; });
    PK.cur = found.filter(f => seen[f.bits] >= 3).map(f => ({ bits: f.bits, hit: pkMatch(f.bits) }));
    drawOverlay(found);
    renderScanList();
  } finally { PK.busy = false; }
}
async function openScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Caméra indisponible (la page doit être en https)'); return; }
  try { PK.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }); }
  catch (e) { toast('Caméra refusée ou indisponible'); return; }
  const v = $('#scan-video');
  v.srcObject = PK.stream; v.muted = true;
  try { await v.play(); } catch (_) {}
  PK.seen = {}; PK.cur = []; PK.sig = ''; PK.lut = null;
  $('#scan-hint').textContent = 'Montre une ou plusieurs cartes à la caméra, bien à plat et de face.';
  $('#scan').hidden = false;
  renderScanList();
  PK.timer = setInterval(pkTick, 160);
}
function closeScan() {
  clearInterval(PK.timer);
  if (PK.stream) PK.stream.getTracks().forEach(t => t.stop());
  PK.stream = null; $('#scan-video').srcObject = null; $('#scan').hidden = true;
}
$('#scan-close').addEventListener('click', closeScan);
$('#scan-go').addEventListener('click', () => {
  const ns = [...new Set(PK.cur.filter(c => c.hit && nameOf(c.hit.n)).map(c => c.hit.n))].sort((a, b) => a - b);
  if (!ns.length) return;
  closeScan(); state.group = ns; setStudent(ns[0]); setView('bareme');
});
$('#scan-reset').addEventListener('click', () => {
  if (!confirm('Oublier les cartes que tu as ajoutées ? (les 40 cartes d’origine restent reconnues)')) return;
  state.plk = {}; PK.lut = null; PK.sig = ''; PK.seen = {}; save(); renderScanList();
});

/* ================= Démarrage ================= */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (ui.view === 'roue' && !spinning) renderRoue(); }, 150);
});
renderTop();
initTools();
setView('roue');
})();
</script>
